<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">
      <markdown [data]="greeting()"></markdown>
    </div>
    <div class="meta"></div>
  </div>
</article>

@for (message of messageViews(); track message.id) {
  <!-- TODO: Render message.text with markdown and each message.toolCalls entry with copilot-render-tool-calls. -->
}

@if (pending()) {
  <article class="msg assistant">
    <div class="avatar">🤖</div>
    <div class="ai-wait-indicator" role="status" aria-label="Assistant is responding">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </div>
  </article>
}

@if (approvalError()) {
  <p role="alert">{{ approvalError() }}</p>
}
