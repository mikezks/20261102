<article class="msg assistant">
  <div class="avatar">🤖</div>
  <div>
    <div class="bubble">
      <markdown [data]="greeting()"></markdown>
    </div>
    <div class="meta"></div>
  </div>
</article>

@for (message of messageViews(); track message.id) {
  @if (message.text) {
    <article class="msg {{ message.variant }}">
      <div class="avatar">{{ message.avatar }}</div>
      <div>
        <div class="bubble">
          <markdown [data]="message.text"></markdown>
        </div>
        <div class="meta"></div>
      </div>
    </article>
  }

  @for (call of message.toolCalls; track call.id) {
    <article class="msg {{ message.variant }}">
      <div class="avatar">{{ message.avatar }}</div>
      <div>
        <div class="bubble bubble--tool">
          <copilot-render-tool-calls
            [message]="call.message"
            [messages]="messages()"
            [agentId]="agentId()"
            [isLoading]="pending()"
          />
        </div>
        <div class="meta"></div>
      </div>
    </article>
  }

  <!-- TODO: Render message.activity with copilot-activity. -->
}

@if (pending()) {
  <article class="msg assistant">
    <div class="avatar">🤖</div>
    <div class="ai-wait-indicator" role="status" aria-label="Assistant is responding">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </div>
  </article>
}

@if (approvalError()) {
  <p role="alert">{{ approvalError() }}</p>
}
