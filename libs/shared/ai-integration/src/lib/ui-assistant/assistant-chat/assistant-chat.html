@if (store() && agentId()) {
  <button
    (click)="toggle()"
    id="ai-toggle"
    class="ai-toggle"
    aria-haspopup="dialog"
    [attr.aria-expanded]="panelVisible()"
    aria-controls="ai-panel"
  >
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9.83a2 2 0 0 0-1.41.59l-2.12 2.12A1 1 0 0 1 4 18.41V5Z"
        stroke="currentColor"
        stroke-width="1.5"
      />
    </svg>
    <span>Assistant</span>
  </button>

  <div
    id="ai-panel"
    [class.panel-open]="panelVisible()"
    class="ai-panel"
    role="dialog"
    aria-modal="false"
    [attr.inert]="panelVisible() ? null : ''"
    (keydown.escape)="toggle()"
    aria-labelledby="ai-title"
  >
    <header class="ai-header">
      <div class="ai-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 2l2.39 4.84L20 7.27l-3.64 3.54.86 5.02L12 13.77 6.78 15.83l.86-5.02L4 7.27l5.61-.43L12 2Z"
            stroke="currentColor"
            stroke-width="1.4"
          />
        </svg>
        <div>
          <div id="ai-title">AI Assistant</div>
        </div>
      </div>
      <button (click)="toggle()" class="icon-btn" id="ai-close" title="Close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6 6 18"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <div class="ai-actions">
        @if (showModeSelector()) {
          <select
            class="form-control mode-select"
            #modeSelect
            aria-label="Agent mode"
            [value]="mode()"
            (change)="setMode(modeSelect.value)"
          >
            <option value="plan">Plan</option>
            <option value="execution">Execution</option>
          </select>
        }
        @if (voice.languages().length) {
          <select
            class="form-control lang-select"
            [ngModel]="voice.language()"
            (ngModelChange)="setLanguage($event)"
            name="voiceLanguage"
            title="Language"
            aria-label="Language"
          >
            @for (language of voice.languages(); track language) {
              <option [value]="language">
                {{ voice.describeLanguage(language) }}
              </option>
            }
          </select>
        }
        <button
          (click)="toggleReading()"
          class="icon-btn"
          [disabled]="!voice.readingSupported"
          [attr.aria-pressed]="voice.readingEnabled()"
          [title]="voice.readingEnabled() ? 'Disable read-aloud' : 'Enable read-aloud'"
          [attr.aria-label]="voice.readingEnabled() ? 'Disable read-aloud' : 'Enable read-aloud'"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4V5Z" />
            @if (voice.readingEnabled()) {
              <path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
            } @else {
              <path d="m16 9 6 6m0-6-6 6" />
            }
          </svg>
        </button>
      </div>
    </header>

    <section id="ai-messages" class="ai-messages" aria-live="polite" #messagesContainer>
      <app-chat-messages
        [messages]="messages()"
        [store]="store()!"
        [agentId]="agentId()!"
        [greeting]="greeting()"
        [pending]="isRunning()"
      />
    </section>

    @if (error()) {
      <p role="alert" class="ai-error">{{ error() }}</p>
    }
    @if (voice.error()) {
      <p role="alert" class="ai-error">{{ voice.error() }}</p>
    }
    <form id="ai-composer" class="ai-composer" autocomplete="off" (ngSubmit)="submit()">
      <div class="composer-inner">
        <label for="assistant-message">Message</label>
        <textarea
          id="assistant-message"
          #composerInput
          [(ngModel)]="message"
          class="form-control composer-input"
          rows="2"
          (keydown.enter)="onComposerEnter($event)"
          name="message"
          aria-label="Message to the assistant"
          placeholder="Ask the assistant…"
        ></textarea>
        <div class="composer-actions">
          <span class="composer-hint">Enter to send · Shift+Enter for a new line</span>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="isRunning() || !message().trim()"
          >
            Send
          </button>
          @if (voice.dictationSupported) {
            <button
              type="button"
              class="btn btn-primary voice-dictation mic-btn"
              [attr.aria-pressed]="voice.dictating()"
              (click)="toggleDictation()"
              [title]="voice.dictating() ? 'Stop dictation' : 'Start dictation'"
              [attr.aria-label]="voice.dictating() ? 'Stop dictation' : 'Start dictation'"
            >
              <i class="icon-mic" aria-hidden="true"></i>
              {{ voice.dictating() ? 'Stop dictation' : 'Dictate' }}
            </button>
          }
          @if (isRunning()) {
            <button
              type="button"
              class="btn btn-default stop-btn"
              (click)="stopRun()"
              title="Stop current request"
              aria-label="Stop current request"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" />
              </svg>
              <span>Stop</span>
            </button>
          }
        </div>
      </div>
    </form>
  </div>
}
