<div class="card">
  <div class="card-header">
    <h2 class="card-title">Flight Search</h2>
  </div>

  <div class="card-body">
    @if (loading()) {
      <p role="status">Loading flights…</p>
    }
    @if (error()) {
      <p role="alert">{{ error() }}</p>
    }
    <app-flight-filter [filter]="filter()" (filterChange)="search($event)">
      @if (flights().length) {
        <div class="flight-filter-info">{{ flights().length }} flights found!</div>
      }
      @if (flights().length) {
        <button (click)="reset()" class="btn btn-default flight-filter-button">Reset</button>
      }
    </app-flight-filter>
  </div>
</div>

<div class="row">
  @for (flight of flights(); track flight.id) {
    <div class="col-xs-12 col-sm-6 col-md-4">
      <app-flight-card
        [item]="flight"
        [selected]="basket()[flight.id]"
        (selectedChange)="updateBasket(flight.id, $event)"
        (delayTrigger)="delay($event)"
      />
    </div>
  }
</div>

<div class="card">
  <div class="card-header">
    <h2 class="card-title">Basket</h2>
  </div>

  <div class="card-body">
    <pre tabindex="0" aria-label="Selected flight IDs">{{ basket() | json }}</pre>
  </div>
</div>
